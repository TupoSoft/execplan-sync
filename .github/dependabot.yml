version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      groups:
          runtime-dependencies:
              dependency-type: production
          development-dependencies:
              dependency-type: development
      labels:
          - dependencies
      commit-message:
          prefix: 'chore(deps)'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      groups:
          github-actions:
              patterns:
                  - '*'
      labels:
          - dependencies
      commit-message:
          prefix: 'chore(deps)'
